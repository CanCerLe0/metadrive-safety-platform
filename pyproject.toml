[project]
name = "metadrive-safety-platform"
version = "0.1.0"
description = "MetaDrive-based safety scenario generation and evaluation platform"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "metadrive-simulator",
    "numpy>=1.26,<3",
    "pydantic>=2,<3",
    "scikit-learn>=1.5,<2",
    "sqlalchemy>=2,<3",
]

[project.optional-dependencies]
nl = ["httpx>=0.27,<1"]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<10"]

[tool.uv.sources]
metadrive-simulator = { git = "https://github.com/metadriverse/metadrive.git", tag = "MetaDrive-0.4.3" }

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
